<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RIAGRO CRM | Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, #e7efe8, #f6f9f7);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #163b2e;
      }
      .card {
        width: min(460px, 92vw);
        background: #fff;
        border-radius: 14px;
        padding: 28px;
        box-shadow: 0 10px 26px rgba(19, 66, 50, 0.16);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }
      p {
        margin: 0;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <h1>Sem conexao com a internet</h1>
      <p>O RIAGRO CRM continua disponivel em modo offline para paginas em cache. Tente novamente quando a conexao voltar.</p>
    </section>
  </body>
</html>
